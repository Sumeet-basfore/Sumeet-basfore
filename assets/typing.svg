<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" role="img" aria-label="what happens after the AI writes the code?">
  <title>what happens after the AI writes the code?</title>
  <defs>
    <clipPath id="reveal">
      <rect x="0" y="0" width="690" height="72">
        <animate attributeName="width" values="0;690;690" keyTimes="0;0.55;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="900" height="72" rx="14" fill="#14181D"/>
  <rect x="0.75" y="0.75" width="898.5" height="70.5" rx="13.5" fill="none" stroke="#303942" stroke-width="1.5"/>
  <text x="36" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#E8E4DA" textLength="650" lengthAdjust="spacing" clip-path="url(#reveal)">what happens <tspan fill="#7DD3C0">after</tspan> the AI writes the code?</text>
  <rect x="26" y="20" width="4" height="32" fill="#E8B86D">
    <animate attributeName="x" values="26;690;690" keyTimes="0;0.55;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
