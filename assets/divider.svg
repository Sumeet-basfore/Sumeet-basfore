<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" role="img" aria-label="Decorative divider with pulsing connected nodes">
  <title>Decorative divider</title>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="0.3" y2="0">
      <stop offset="0" stop-color="#7DD3C0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7DD3C0"/>
      <stop offset="1" stop-color="#E8B86D" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.7;1.3" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="19" width="1200" height="2" fill="url(#flow)"/>
  <circle cx="100" cy="20" r="3" fill="#E8E4DA">
    <animate attributeName="r" values="2.5;5;2.5" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="20" r="3" fill="#E8E4DA">
    <animate attributeName="r" values="2.5;5;2.5" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="20" r="3" fill="#E8E4DA">
    <animate attributeName="r" values="2.5;5;2.5" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="20" r="3" fill="#E8E4DA">
    <animate attributeName="r" values="2.5;5;2.5" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="20" r="3" fill="#E8E4DA">
    <animate attributeName="r" values="2.5;5;2.5" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="20" r="3" fill="#E8E4DA">
    <animate attributeName="r" values="2.5;5;2.5" dur="2.4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="2s" repeatCount="indefinite"/>
  </circle>
</svg>
